# cargo-audit configuration
# See https://rustsec.org/advisories/ and https://docs.rs/cargo-audit/

[advisories]
# Upstream advisories not reachable via our code, ignored to unblock CI.
#
# RAND UNSOUNDNESS (upstream):
#   RUSTSEC-2026-0097 — rand 0.8.x / 0.9.x is unsound with a custom
#   logger using rand::rng(). Pulled in transitively via quinn-proto,
#   proptest, metrics-util, and ring. Egregore does not install a
#   custom logger calling rand::rng(); the unsoundness is not reachable
#   from our code.
#
# rustls-webpki 0.103.9 (four advisories, pulled in via rustls 0.23.x
# from the reqwest/self_update TLS stack). The fix lands in
# rustls-webpki 0.104.x, currently only available as a pre-release
# (0.104.0-alpha.7 as of 2026-04-23). Upgrading requires rustls 0.24+
# (also pre-release) with coordinated tokio-rustls / hyper-rustls /
# reqwest alignment. Revisit when the 0.104.x line reaches stable:
#   RUSTSEC-2026-0049 — CRL matching-logic bug
#   RUSTSEC-2026-0098 — Name constraints incorrectly accepted for URI
#   RUSTSEC-2026-0099 — Name constraints incorrectly accepted for
#     certificates asserting a wildcard name
#   RUSTSEC-2026-0104 — Reachable panic in CRL parsing
#
# quick-xml 0.38.4 (via self_update 0.44, the operator-triggered
# `egregore update` flow). Both fixes require quick-xml >=0.41, a
# semver-major bump self_update has not adopted (no release beyond
# 0.44 as of 2026-08-05). Both are DoS-class issues parsing
# attacker-controlled XML; the updater only parses GitHub release
# metadata over TLS, so reachability is low. Revisit on next
# self_update release:
#   RUSTSEC-2026-0194 — quadratic run time checking a start tag for
#     duplicate attribute names
#   RUSTSEC-2026-0195 — unbounded namespace-declaration allocation in
#     NsReader enables memory-exhaustion denial of service
ignore = [
  "RUSTSEC-2026-0097",
  "RUSTSEC-2026-0049",
  "RUSTSEC-2026-0098",
  "RUSTSEC-2026-0099",
  "RUSTSEC-2026-0104",
  "RUSTSEC-2026-0194",
  "RUSTSEC-2026-0195",
]
